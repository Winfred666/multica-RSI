<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Machine resources</title>
<style>
:root{font:12px/1.4 system-ui,sans-serif;color:#34473f;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:12px;background:#fff}main{max-width:520px;margin:auto;display:grid;gap:12px}.row{display:grid;grid-template-columns:38px 1fr 34px;gap:10px;align-items:center}.battery{position:relative;height:16px;padding:2px;border:1px solid #9eafa5;border-radius:3px}.battery:after{content:"";position:absolute;right:-4px;top:4px;width:3px;height:6px;border-radius:0 2px 2px 0;background:#9eafa5}.fill{height:100%;border-radius:1px;background:#53aa83}.value{text-align:right;font-variant-numeric:tabular-nums;color:#63756b}
</style>
<main aria-label="Machine resources, recorded snapshot">
<div class="row"><span>GPU</span><div class="battery" role="meter" aria-label="GPU usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" style="width:0%"></div></div><span class="value">0%</span></div>
<div class="row" title="0.9 / 11.0 GiB"><span>VRAM</span><div class="battery" role="meter" aria-label="GPU memory" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8.6"><div class="fill" style="width:8.6%"></div></div><span class="value">9%</span></div>
<div class="row" title="8.6 / 15.6 GiB"><span>RAM</span><div class="battery" role="meter" aria-label="System memory" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55.4"><div class="fill" style="width:55.4%"></div></div><span class="value">55%</span></div>
</main>
</html>
