<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ideas</title>
<style>
:root{font:12px/1.5 system-ui,sans-serif;color:#35405a;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:12px;background:#fff}main{max-width:520px;margin:auto}ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}label{display:flex;align-items:center;gap:8px;cursor:pointer}input[type=checkbox]{accent-color:#6878c9;margin:0}label:has(:checked) span{color:#8b93a6;text-decoration:line-through}.add-idea{display:flex;gap:8px;margin-top:12px}input[type=text]{width:100%;min-width:0;border:0;border-bottom:1px solid #e3e6ee;padding:4px 0;font:inherit;background:transparent}button{border:0;background:transparent;color:#6878c9;font:18px system-ui;cursor:pointer}input:focus-visible,button:focus-visible{outline:2px solid #6878c9;outline-offset:2px}
</style>
<main aria-label="Idea checklist">
<ul id="ideas">
<li><label><input type="checkbox" checked><span>Trim recall context</span></label></li>
<li><label><input type="checkbox"><span>Refute the strongest branch</span></label></li>
<li><label><input type="checkbox"><span>Reuse the accepted checkpoint</span></label></li>
</ul>
<div class="add-idea"><input type="text" aria-label="New idea" placeholder="Next idea…"><button aria-label="Add idea">+</button></div>
</main>
<script>
function addIdea(){
 const input=document.querySelector('input[type=text]'),text=input.value.trim();if(!text)return;
 const row=document.createElement('li'),label=document.createElement('label'),check=document.createElement('input'),title=document.createElement('span');
 check.type='checkbox';title.textContent=text;label.append(check,title);row.append(label);document.getElementById('ideas').append(row);input.value='';input.focus();
}
document.querySelector('button').addEventListener('click',addIdea);
document.querySelector('input[type=text]').addEventListener('keydown',event=>{if(event.key==='Enter')addIdea()});
</script>
</html>
